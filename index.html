<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Salário Portugal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }
        h1 { 
            color: #1a202c; 
            font-size: 24px; 
            margin-bottom: 8px; 
            text-align: center;
        }
        .subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            color: #2d3748; 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5a67d8; }
        .result {
            margin-top: 24px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .container { padding: 24px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor Salário Portugal</h1>
        <p class="subtitle">Calcula o teu salário líquido em Portugal</p>
        
        <div class="form-group">
            <label for="bruto">Salário Bruto Mensal (€)</label>
            <input type="number" id="bruto" placeholder="Ex: 1500">
        </div>
        
        <div class="form-group">
            <label for="dependentes">Nº de Dependentes</label>
            <input type="number" id="dependentes" placeholder="Ex: 0">
        </div>
        
        <button onclick="calcular()">Calcular Salário Líquido</button>
        
        <div id="resultado" class="result" style="display: none;"></div>
    </div>

    <script>
        function calcular() {
            const bruto = parseFloat(document.getElementById('bruto').value);
            const dependentes = parseInt(document.getElementById('dependentes').value) || 0;
            
            if (!bruto) {
                alert('Insere o salário bruto');
                return;
            }
            
            // Cálculo simplificado IRS + SS 11%
            const ss = bruto * 0.11;
            const irs = bruto * 0.15 - (dependentes * 50);
            const liquido = bruto - ss - irs;
            
            document.getElementById('resultado').style.display = 'block';
            document.getElementById('resultado').innerHTML = `
                <strong>Salário Líquido: €${liquido.toFixed(2)}</strong><br>
                <small>Seg. Social: -€${ss.toFixed(2)} | IRS: -€${irs.toFixed(2)}</small>
            `;
        }
    </script>
</body>
</html>
