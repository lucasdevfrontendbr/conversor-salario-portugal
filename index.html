<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Salário Portugal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* CUBO 3D GIGANTE DE PORTUGAL */
        .scene {
            width: 200px;
            height: 200px;
            perspective: 800px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 12s infinite linear;
        }
        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            opacity: 0.15;
            border: 2px solid rgba(255,255,255,0.1);
        }
        /* CORES DE PORTUGAL */
        .cube-face-front  { 
            background: #046A38; /* Verde */
            transform: rotateY(0deg) translateZ(100px); 
        }
        .cube-face-right  { 
            background: #DA291C; /* Vermelho */
            transform: rotateY(90deg) translateZ(100px); 
        }
        .cube-face-back   { 
            background: #046A38; /* Verde */
            transform: rotateY(180deg) translateZ(100px); 
        }
        .cube-face-left   { 
            background: #DA291C; /* Vermelho */
            transform: rotateY(-90deg) translateZ(100px); 
        }
        .cube-face-top    { 
            background: #FFCC00; /* Amarelo */
            transform: rotateX(90deg) translateZ(100px); 
        }
        .cube-face-bottom { 
            background: #046A38; /* Verde */
            transform: rotateX(-90deg) translateZ(100px); 
        }
        
        @keyframes girar {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }
        
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            padding: 32px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        h1 { 
            color: #1a202c; 
            font-size: 24px; 
            margin-bottom: 8px; 
            text-align: center;
        }
        .subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            color: #2d3748; 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            background: white;
        }
        input:focus {
            outline: none;
            border-color: #DA291C;
        }
        .result {
            margin-top: 24px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #046A38;
            min-height: 80px;
        }
        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #046A38;
            margin-bottom: 8px;
        }
        .result-detail {
            color: #718096;
            font-size: 13px;
            line-height: 1.6;
        }
        @media (max-width: 480px) {
            .scene { 
                width: 120px; 
                height: 120px; 
            }
            .cube-face { width: 120px; height: 120px; }
            .cube-face-front  { transform: rotateY(0deg) translateZ(60px); }
            .cube-face-right  { transform: rotateY(90deg) translateZ(60px); }
            .cube-face-back   { transform: rotateY(180deg) translateZ(60px); }
            .cube-face-left   { transform: rotateY(-90deg) translateZ(60px); }
            .cube-face-top    { transform: rotateX(90deg) translateZ(60px); }
            .cube-face-bottom { transform: rotateX(-90deg) translateZ(60px); }
            .container { padding: 24px; max-width: 340px; }
            h1 { font-size: 20px; }
            .result-value { font-size: 26px; }
        }
    </style>
</head>
<body>
    <!-- CUBO 3D GIGANTE DE PORTUGAL NO FUNDO -->
    <div class="scene">
        <div class="cube">
            <div class="cube-face cube-face-front"></div>
            <div class="cube-face cube-face-back"></div>
            <div class="cube-face cube-face-right"></div>
            <div class="cube-face cube-face-left"></div>
            <div class="cube-face cube-face-top"></div>
            <div class="cube-face cube-face-bottom"></div>
        </div>
    </div>

    <div class="container">
        <h1>Conversor Salário Portugal</h1>
        <p class="subtitle">Calcula automaticamente o teu salário líquido</p>
        
        <div class="form-group">
            <label for="bruto">Salário Bruto Mensal (€)</label>
            <input type="number" id="bruto" placeholder="Ex: 1500" oninput="calcular()">
        </div>
        
        <div class="form-group">
            <label for="dependentes">Nº de Dependentes</label>
            <input type="number" id="dependentes" placeholder="Ex: 0" oninput="calcular()">
        </div>
        
        <div id="resultado" class="result">
            <div class="result-value">€0.00</div>
            <div class="result-detail">Insere o salário bruto para ver o cálculo</div>
        </div>
    </div>

    <script>
        function calcular() {
            const bruto = parseFloat(document.getElementById('bruto').value) || 0;
            const dependentes = parseInt(document.getElementById('dependentes').value) || 0;
            
            if (bruto === 0) {
                document.getElementById('resultado').innerHTML = `
                    <div class="result-value">€0.00</div>
                    <div class="result-detail">Insere o salário bruto para ver o cálculo</div>
                `;
                return;
            }
            
            const ss = bruto * 0.11;
            const irs = Math.max(0, bruto * 0.15 - (dependentes * 50));
            const liquido = bruto - ss - irs;
            
            document.getElementById('resultado').innerHTML = `
                <div class="result-value">€${liquido.toFixed(2)}</div>
                <div class="result-detail">
                    Bruto: €${bruto.toFixed(2)}<br>
                    Seg. Social 11%: -€${ss.toFixed(2)}<br>
                    IRS: -€${irs.toFixed(2)}<br>
                    <strong>Líquido: €${liquido.toFixed(2)}</strong>
                </div>
            `;
        }
        calcular();
    </script>
</body>
</html>
