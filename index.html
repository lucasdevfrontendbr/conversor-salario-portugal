<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Bot B2B | 86 Reuniões/mês | Lucas Lima</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title-badge {
            background: #ff4d00;
            color: #00ff41;
            padding: 15px 40px;
            font-size: 2rem;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 15px;
            border: 3px solid #ffdd00;
            text-shadow: 2px 2px 0px #000;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 40px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 30px;
            align-items: center;
        }
        
        /* CUBO 3D ESQUERDA */
        .scene {
            width: 250px;
            height: 250px;
            perspective: 800px;
            margin: 0 auto;
        }
        
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 8s infinite linear;
        }
        
        @keyframes rotateCube {
            0% { transform: rotateX(-15deg) rotateY(0deg); }
            100% { transform: rotateX(-15deg) rotateY(360deg); }
        }
        
        .face {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 4px solid #ffdd00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 2px 2px 0px #000;
        }
        
        .front {
            background: #00c853;
            transform: rotateY(0deg) translateZ(125px);
        }
        .front::before {
            content: "BOT";
            position: absolute;
            top: 20px;
            font-size: 1.5rem;
        }
        
        .back {
            background: #00c853;
            transform: rotateY(180deg) translateZ(125px);
        }
        
        .right {
            background: #ff4d00;
            transform: rotateY(90deg) translateZ(125px);
        }
        .right::before {
            content: "SALÁRIO";
            writing-mode: vertical-rl;
        }
        
        .left {
            background: #ff4d00;
            transform: rotateY(-90deg) translateZ(125px);
        }
        
        .top {
            background: #00c853;
            transform: rotateX(90deg) translateZ(125px);
        }
        
        .bottom {
            background: #ff4d00;
            transform: rotateX(-90deg) translateZ(125px);
        }
        
        /* FORM CENTRAL */
        .form-card {
            background: #1e3a8a;
            border: 4px solid #ffdd00;
            padding: 30px;
            border-radius: 15px;
        }
        
        .form-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #fff;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            border: 3px solid #1e40af;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
        }
        
        .input-group input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .btn-calc {
            width: 100%;
            padding: 18px;
            background: #fbbf24;
            border: 4px solid #f59e0b;
            color: #0a0e27;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        
        .btn-calc:hover {
            background: #ffdd00;
            transform: scale(1.02);
        }
        
        /* CARD CONTATO DIREITA */
        .contact-card {
            background: #1e3a8a;
            border: 4px solid #ffdd00;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        
        .contact-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .contact-name {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #fbbf24;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .social-icons a {
            width: 55px;
            height: 55px;
            background: #fbbf24;
            border: 3px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #0a0e27;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .social-icons a:hover {
            background: #ffdd00;
            transform: translateY(-5px);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #0a0e27;
            border: 2px solid #00ff41;
            display: none;
            text-align: left;
        }
        
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .scene {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-badge">PIPELINE BOT B2B</div>
            <p class="subtitle">86 reuniões B2B agendadas no automático este mês</p>
        </div>
        
        <div class="main-grid">
            <!-- CUBO 3D -->
            <div class="scene">
                <div class="cube">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
            
            <!-- FORM CALCULADORA -->
            <div class="form-card">
                <h2 class="form-title">Salário Bruto Mensal (€)</h2>
                <div class="input-group">
                    <input type="number" id="salario" placeholder="2000" value="2000">
                </div>
                
                <h2 class="form-title">Nº de Dependentes</h2>
                <div class="input-group">
                    <input type="number" id="dependentes" placeholder="3" value="3" min="0">
                </div>
                
                <button class="btn-calc" onclick="calcular()">Calcular Salário Líquido</button>
                
                <div class="result" id="resultado"></div>
            </div>
            
            <!-- CONTATO -->
            <div class="contact-card">
                <h3 class="contact-title">Gostou do projeto? Fala comigo!</h3>
                <p class="contact-name">Lucas Lima - Dev Junior</p>
                
                <div class="social-icons">
                    <!-- TROCA OS LINKS AQUI -->
                    <a href="https://linkedin.com/in/SEU-LINKEDIN" target="_blank" title="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/SEU-GITHUB" target="_blank" title="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="mailto:SEU@EMAIL.COM" title="Email">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="https://wa.me/55SEUNUMERO" target="_blank" title="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            const salario = parseFloat(document.getElementById('salario').value);
            const dependentes = parseInt(document.getElementById('dependentes').value) || 0;
            
            if (!salario) {
                alert('Insira um salário válido');
                return;
            }
            
            // Cálculo Portugal 2026 simplificado
            const ss = salario * 0.11;
            const irs = salario * 0.145 - (dependentes * 50);
            const liquido = salario - ss - irs;
            
            document.getElementById('resultado').innerHTML = `
                <strong>> RESULTADO:</strong><br>
                > Bruto: €${salario.toFixed(2)}<br>
                > Seg. Social: -€${ss.toFixed(2)}<br>
                > IRS: -€${irs.toFixed(2)}<br>
                > <strong>Líquido: €${liquido.toFixed(2)}</strong>
            `;
            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
