<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Bot B2B | 86 Reuniões/mês | Lucas Lima</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-badge">PIPELINE BOT B2B</div>
            <p class="subtitle">86 reuniões B2B agendadas no automático este mês</p>
        </div>
        
        <div class="main-grid">
            <div class="cube-wrapper">
                <div class="scene">
                    <div class="cube">
                        <div class="face front">BOT</div>
                        <div class="face back">2026</div>
                        <div class="face right">SALÁRIO</div>
                        <div class="face left">QA</div>
                        <div class="face top"></div>
                        <div class="face bottom"></div>
                    </div>
                </div>
            </div>
            
            <div class="form-card">
                <h2 class="form-title">Salário Bruto Mensal (€)</h2>
                <div class="input-group">
                    <input type="number" id="salario" placeholder="2000" value="2000">
                </div>
                
                <h2 class="form-title">Nº de Dependentes</h2>
                <div class="input-group">
                    <input type="number" id="dependentes" placeholder="3" value="3" min="0">
                </div>
                
                <button class="btn-calc" id="btnCalcular">CALCULAR SALÁRIO LÍQUIDO</button>
                
                <div class="result" id="resultado"></div>
            </div>
            
            <div class="contact-card">
                <h3 class="contact-title">Gostou do projeto?<br>Fala comigo!</h3>
                <p class="contact-name">Lucas Lima - Dev Junior</p>
                
                <div class="social-icons">
                    <!-- TROCA AS 4 LINHAS ABAIXO PELOS TEUS LINKS REAIS -->
                    <a href="COLA_SEU_LINKEDIN_AQUI" target="_blank" class="linkedin"> <<< TROCA AQUI
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                    <a href="COLA_SEU_GITHUB_AQUI" target="_blank" class="github"> <<< TROCA AQUI
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="mailto:COLA_SEU_EMAIL_AQUI" class="email"> <<< TROCA AQUI
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                    <a href="https://wa.me/55DDDNUMERO" target="_blank" class="whatsapp"> <<< TROCA AQUI
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
